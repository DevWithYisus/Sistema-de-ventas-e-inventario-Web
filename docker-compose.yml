services:
  postgres:
    image: postgres:16
    container_name: ventas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - ventas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # La API en contenedor, igual que en producción. No arranca con un simple "docker compose up":
  #   docker compose --profile api up --build
  # Necesita un archivo .env (copia .env.example).
  api:
    profiles: ["api"]
    build: .
    container_name: ventas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=sistema_ventas;Username=ventas_app;Password=${VENTAS_APP_PASSWORD}"
      Jwt__Issuer: "mininos-api"
      Jwt__Audience: "mininos-web"
      Jwt__Key: "${JWT_KEY}"
      Plataforma__Clave: "${PLATAFORMA_CLAVE}"
      Cors__OrigenesPermitidos__0: "${CORS_ORIGEN}"
      Negocio__ZonaHoraria: "America/Bogota"

volumes:
  ventas_pgdata:
